services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optiscan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OptiScan Backend
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - VISION_PROVIDER=${VISION_PROVIDER:-gemini}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
